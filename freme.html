<!DOCTYPE html>
<html>
  <head>
    <title>
      Vivaiathan
    </title>
  </head>
  <body>
    <div class="ui-cyber">
      <div class="ui-cyber-tag">SYSTEM_LOG</div>
      <h3 class="ui-cyber-title">ミッションアップデート</h3>
      <p class="ui-cyber-text">周囲を確認してください</p>

      <iframe src=""></iframe>
    </div>

    <style>
      
      .ui-cyber {
        position: relative;
        margin: 1.5em 0;
        padding: 1.5em;
        background: rgba(10, 15, 30, 0.9); /* 暗いネイビー */
        border: 2px solid #00ffcc; /* ネオングリーン */
        border-radius: 0 16px 0 16px; /* 対角線を角丸に */
        box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); /* 光彩効果 */
        color: #e0ffff;
        font-family: sans-serif;
      }
      .ui-cyber-tag {
        position: absolute;
        top: -10px;
        left: 15px;
        background: #00ffcc;
        color: #0a0f1e;
        font-size: 0.75rem;
        padding: 2px 8px;
        font-weight: bold;
        letter-spacing: 1px;
      }
      .ui-cyber-title {
        margin: 0 0 10px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 5px #00ffcc;
      }
      .ui-cyber-text {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.5;
      }

    </style>
  </body>
</html>
