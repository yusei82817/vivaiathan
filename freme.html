<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d12">
  <title>VIVAIATHAN // Command Interface</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#080d12; color:#e8f0f2; font-family:Inter,Arial,sans-serif; }
    .command-shell { height:100%; display:grid; grid-template-rows:58px minmax(0,1fr) 28px; padding:12px; gap:9px; }
    .topbar,.bottombar { display:flex; align-items:center; justify-content:space-between; border:1px solid rgba(145,177,190,.18); background:rgba(12,19,25,.96); padding:0 18px; }
    .brand { display:flex; align-items:center; gap:13px; font:700 19px 'Barlow Condensed',Arial,sans-serif; letter-spacing:.18em; }
    .brand-symbol { width:25px; height:25px; border:1px solid #69d5d2; transform:rotate(45deg); position:relative; }
    .brand-symbol:after { content:""; position:absolute; inset:5px; background:#69d5d2; opacity:.65; }
    .top-meta,.bottombar { color:#82949c; font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
    .top-meta { display:flex; gap:24px; align-items:center; }
    .screen-wrap { min-height:0; position:relative; border:1px solid rgba(145,177,190,.2); background:#080d12; overflow:hidden; }
    iframe { display:block; width:100%; height:100%; border:0; background:#080d12; }
    .bottombar { font-size:9px; }
    @media(max-width:600px) { .command-shell{padding:6px;gap:6px;grid-template-rows:50px minmax(0,1fr) 25px}.top-meta .optional{display:none}.brand{font-size:16px} }
  </style>
</head>
<body>
  <div class="command-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-symbol"></span><span>VIVAIATHAN</span></div>
      <div class="top-meta"><span><i class="status-dot"></i> SYSTEM ONLINE</span><span class="optional">BUILD 0.0.1 // PRE-ALPHA</span><span>EN-US</span></div>
    </header>
    <main class="screen-wrap">
      <iframe id="game-screen" src="title.html" title="Vivaiathan game interface" allow="fullscreen"></iframe>
    </main>
    <footer class="bottombar"><span>SECURE SESSION // LOCAL INTERFACE</span><span>VIVAIATHAN SYSTEMS <span style="color:#69d5d2">●</span></span></footer>
  </div>
  <script>
    const screenFrame = document.getElementById('game-screen');
    window.setScreen = function (path) {
      if (!/^(title|lobby|game)\.html$/.test(path)) return;
      screenFrame.src = path;
    };
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || !event.data || typeof event.data.screen !== 'string') return;
      window.setScreen(event.data.screen);
    });
  </script>
</body>
</html>
