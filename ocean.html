<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#58b8ef">
  <title>VIVAIATHAN // Ocean</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #58b8ef; }
    body { position: relative; }
    #ocean { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #underwater {
      position: fixed; inset: 0; pointer-events: none; opacity: 1;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(74, 214, 255, .72), transparent 58%),
        radial-gradient(ellipse at 50% 115%, rgba(0, 18, 105, .48), transparent 68%),
        linear-gradient(180deg, rgba(0, 139, 235, .94) 0%, rgba(0, 91, 204, .95) 42%, rgba(0, 43, 153, .97) 100%);
      mix-blend-mode: normal; transition: opacity .15s linear;
    }
    .loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: rgba(12, 48, 65, .72); font: 600 10px Arial, sans-serif;
      letter-spacing: .24em; pointer-events: none; transition: opacity .7s ease;
    }
    .loading.done { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      .loading { transition: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="ocean" aria-label="Cinematic underwater-to-surface ocean scene"></canvas>
  <div id="underwater"></div>
  <div class="loading" id="loading">INITIALIZING OCEAN</div>

  <script type="module">
    import * as THREE from 'three';
    import { Water } from 'three/addons/objects/Water.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const canvas = document.getElementById('ocean');
    const loading = document.getElementById('loading');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 20000);
    // Begin below the surface, then rise through it into the open air.
    camera.position.set(0, -8, 82);
    camera.lookAt(0, 2, -100);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.82;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // Custom summer-sky shader: colors are authored directly, not inferred
    // from atmospheric scattering, so the blue stays saturated and predictable.
    const sun = new THREE.Vector3();
    sun.setFromSphericalCoords(
      1,
      THREE.MathUtils.degToRad(48),
      THREE.MathUtils.degToRad(205)
    );

    const skyGeometry = new THREE.SphereGeometry(10000, 48, 32);
    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      toneMapped: false,
      uniforms: {
        uSunDirection: { value: sun.clone().normalize() },
        uZenith: { value: new THREE.Color('#0759cf') },
        uUpper: { value: new THREE.Color('#087bea') },
        uHorizon: { value: new THREE.Color('#54c5f5') },
        uSunColor: { value: new THREE.Color('#fff2d2') }
      },
      vertexShader: `
        varying vec3 vSkyDirection;
        void main() {
          vSkyDirection = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uSunDirection;
        uniform vec3 uZenith;
        uniform vec3 uUpper;
        uniform vec3 uHorizon;
        uniform vec3 uSunColor;
        varying vec3 vSkyDirection;

        void main() {
          vec3 direction = normalize(vSkyDirection);
          float height = clamp(direction.y, 0.0, 1.0);
          vec3 skyColor = mix(uHorizon, uUpper, smoothstep(0.0, 0.52, height));
          skyColor = mix(skyColor, uZenith, smoothstep(0.52, 1.0, height));

          float sunDot = max(dot(direction, normalize(uSunDirection)), 0.0);
          float sunDisk = smoothstep(0.99935, 0.99982, sunDot);
          float sunHalo = pow(sunDot, 36.0) * 0.22;
          skyColor = mix(skyColor, uSunColor, clamp(sunDisk + sunHalo, 0.0, 1.0));

          gl_FragColor = vec4(skyColor, 1.0);
          #include <colorspace_fragment>
        }
      `
    });
    const skyDome = new THREE.Mesh(skyGeometry, skyMaterial);
    skyDome.renderOrder = -1000;
    scene.add(skyDome);

    // Soft white summer cumulus clouds, kept near the horizon.
    const cloudCanvas = document.createElement('canvas');
    cloudCanvas.width = 512;
    cloudCanvas.height = 256;
    const cloudCtx = cloudCanvas.getContext('2d');
    cloudCtx.clearRect(0, 0, 512, 256);
    const cloudPuffs = [
      [90, 164, 90, 54], [158, 132, 92, 78], [236, 150, 108, 76],
      [320, 164, 92, 58], [395, 180, 70, 42], [190, 190, 170, 36]
    ];
    for (const [x, y, rx, ry] of cloudPuffs) {
      const puff = cloudCtx.createRadialGradient(x, y - ry * 0.12, 2, x, y, Math.max(rx, ry));
      puff.addColorStop(0, 'rgba(255,255,255,0.96)');
      puff.addColorStop(0.58, 'rgba(255,255,255,0.82)');
      puff.addColorStop(1, 'rgba(255,255,255,0)');
      cloudCtx.fillStyle = puff;
      cloudCtx.beginPath();
      cloudCtx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      cloudCtx.fill();
    }
    const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
    cloudTexture.colorSpace = THREE.SRGBColorSpace;
    const cloudMaterial = new THREE.SpriteMaterial({
      map: cloudTexture,
      transparent: true,
      opacity: 0.88,
      depthWrite: false,
      fog: false
    });
    const cloudSpecs = [
      [-2500, 330, -3900, 1500, 750],
      [250, 250, -4600, 1750, 820],
      [2850, 430, -4100, 1450, 700],
      [-900, 620, -6200, 1100, 520]
    ];
    for (const [x, y, z, width, height] of cloudSpecs) {
      const cloud = new THREE.Sprite(cloudMaterial);
      cloud.position.set(x, y, z);
      cloud.scale.set(width, height, 1);
      scene.add(cloud);
    }

    // A soft atmospheric halo reinforces the sun disk rendered by Sky.
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = glowCanvas.height = 256;
    const glowContext = glowCanvas.getContext('2d');
    const glowGradient = glowContext.createRadialGradient(128, 128, 5, 128, 128, 128);
    glowGradient.addColorStop(0, 'rgba(255, 248, 225, 0.9)');
    glowGradient.addColorStop(0.16, 'rgba(255, 232, 184, 0.34)');
    glowGradient.addColorStop(0.48, 'rgba(255, 220, 160, 0.09)');
    glowGradient.addColorStop(1, 'rgba(255, 220, 160, 0)');
    glowContext.fillStyle = glowGradient;
    glowContext.fillRect(0, 0, 256, 256);
    const sunGlowTexture = new THREE.CanvasTexture(glowCanvas);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: sunGlowTexture,
      color: 0xfff0d5,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false
    }));
    sunGlow.position.copy(sun).multiplyScalar(7800);
    sunGlow.scale.set(1250, 1250, 1);
    scene.add(sunGlow);


    const waterNormals = new THREE.TextureLoader().load(
      'https://threejs.org/examples/textures/waternormals.jpg',
      () => loading.classList.add('done'),
      undefined,
      () => loading.classList.add('done')
    );
    waterNormals.wrapS = THREE.RepeatWrapping;
    waterNormals.wrapT = THREE.RepeatWrapping;

    const water = new Water(new THREE.PlaneGeometry(12000, 12000), {
      textureWidth: 768,
      textureHeight: 768,
      waterNormals,
      sunDirection: sun.clone().normalize(),
      sunColor: 0xfff2d8,
      waterColor: 0x086782,
      distortionScale: 3.8,
      fog: false,
      alpha: 1
    });
    water.rotation.x = -Math.PI / 2;
    // Make the animated water visible from beneath the surface as the camera rises.
    water.material.side = THREE.DoubleSide;
    scene.add(water);

    // Distant CC0 Panamax container ship, loaded as a real external GLB asset.
    // Source: Innerscene, "Container ship loaded" (CC0).
    const shipGroup = new THREE.Group();
    shipGroup.position.set(-250, -2.5, -1120);
    scene.add(shipGroup);

    const shipLoader = new GLTFLoader();
    shipLoader.load(
      'https://vivaiathan.netlify.app/.netlify/functions/ship',
      (gltf) => {
        const shipModel = gltf.scene;
        shipModel.scale.setScalar(0.78);

        let bounds = new THREE.Box3().setFromObject(shipModel);
        let dimensions = bounds.getSize(new THREE.Vector3());

        // Some authoring pipelines export Z-up geometry. Convert it to Three.js Y-up.
        if (dimensions.z > dimensions.y) {
          shipModel.rotation.x = -Math.PI / 2;
          bounds = new THREE.Box3().setFromObject(shipModel);
        }

        const center = bounds.getCenter(new THREE.Vector3());
        const bottom = bounds.min.y;
        shipModel.position.set(-center.x, -bottom, -center.z);
        shipGroup.add(shipModel);
      },
      undefined,
      (error) => {
        console.warn('VIVAIATHAN: external container ship model could not be loaded.', error);
      }
    );

    scene.add(new THREE.HemisphereLight(0xdff5ff, 0x24566a, 0.82));

    const sunlight = new THREE.DirectionalLight(0xffedcf, 2.8);
    sunlight.position.copy(sun).multiplyScalar(500);
    scene.add(sunlight);

    const clock = new THREE.Clock();
    const underwaterOverlay = document.getElementById('underwater');
    const ascentDuration = 9.5;
    const startZ = 82;
    const endZ = 30;

    // Manual camera controls unlock after the cinematic ascent.
    const pressedKeys = new Set();
    let cameraYaw = 0;
    let cameraPitch = 0;
    const moveSpeed = 48;
    const turnSpeed = 1.35;
    const controlKeys = new Set([
      'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyZ', 'KeyX',
      'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'
    ]);

    addEventListener('keydown', (event) => {
      if (!controlKeys.has(event.code)) return;
      event.preventDefault();
      if (ascentComplete()) pressedKeys.add(event.code);
    });

    addEventListener('keyup', (event) => {
      pressedKeys.delete(event.code);
    });

    addEventListener('blur', () => pressedKeys.clear());

    function ascentComplete() {
      return clock.elapsedTime >= ascentDuration;
    }

    function smoothstep01(value) {
      const x = THREE.MathUtils.clamp(value, 0, 1);
      return x * x * (3 - 2 * x);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.04);
      const t = clock.elapsedTime;
      const ascent = smoothstep01(t / ascentDuration);

      water.material.uniforms.time.value += delta;
      shipGroup.position.y = -2.5 + Math.sin(t * 0.62) * 0.8;
      shipGroup.rotation.z = Math.sin(t * 0.28) * 0.0025;
      shipGroup.position.x = -250 + Math.sin(t * 0.035) * 8;

      // A slow cinematic ascent: submerged blue, a brief surface crossing,
      // then a calm reveal of the bright horizon.
      if (t < ascentDuration) {
        camera.position.x = Math.sin(t * 0.11) * 0.65;
        camera.position.z = THREE.MathUtils.lerp(startZ, endZ, ascent);
        camera.position.y = THREE.MathUtils.lerp(-8, 7.5, ascent)
          + (ascent > 0.98 ? Math.sin(t * 0.7) * 0.18 : 0);
        camera.lookAt(camera.position.x * 0.12, 2.5, -100);
      } else {
        const turnAmount = turnSpeed * delta;
        if (pressedKeys.has('ArrowLeft')) cameraYaw -= turnAmount;
        if (pressedKeys.has('ArrowRight')) cameraYaw += turnAmount;
        if (pressedKeys.has('ArrowUp')) cameraPitch = Math.min(1.2, cameraPitch + turnAmount);
        if (pressedKeys.has('ArrowDown')) cameraPitch = Math.max(-1.2, cameraPitch - turnAmount);

        const forward = new THREE.Vector3(Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
        const right = new THREE.Vector3(Math.cos(cameraYaw), 0, Math.sin(cameraYaw));
        const movement = new THREE.Vector3();

        if (pressedKeys.has('KeyW')) movement.add(forward);
        if (pressedKeys.has('KeyS')) movement.sub(forward);
        if (pressedKeys.has('KeyD')) movement.add(right);
        if (pressedKeys.has('KeyA')) movement.sub(right);
        if (pressedKeys.has('KeyZ')) movement.y += 1;
        if (pressedKeys.has('KeyX')) movement.y -= 1;

        if (movement.lengthSq() > 0) {
          movement.normalize().multiplyScalar(moveSpeed * delta);
          camera.position.add(movement);
        }

        const lookDirection = new THREE.Vector3(
          Math.sin(cameraYaw) * Math.cos(cameraPitch),
          Math.sin(cameraPitch),
          -Math.cos(cameraYaw) * Math.cos(cameraPitch)
        );
        camera.lookAt(camera.position.clone().add(lookDirection));
      }

      underwaterOverlay.style.opacity = String(1 - smoothstep01((camera.position.y + 5.5) / 8.5));

      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
      renderer.setSize(innerWidth, innerHeight);
    });

    setTimeout(() => loading.classList.add('done'), 5000);
  </script>
</body>
</html>
