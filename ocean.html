<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#58b8ef">
  <title>VIVAIATHAN // Ocean</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #58b8ef; }
    body { position: relative; }
    #ocean { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #underwater {
      position: fixed; inset: 0; pointer-events: none; opacity: 1;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(74, 214, 255, .72), transparent 58%),
        radial-gradient(ellipse at 50% 115%, rgba(0, 18, 105, .48), transparent 68%),
        linear-gradient(180deg, rgba(0, 139, 235, .94) 0%, rgba(0, 91, 204, .95) 42%, rgba(0, 43, 153, .97) 100%);
      mix-blend-mode: normal; transition: opacity .15s linear;
    }
    .loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: rgba(12, 48, 65, .72); font: 600 10px Arial, sans-serif;
      letter-spacing: .24em; pointer-events: none; transition: opacity .7s ease;
    }
    .loading.done { opacity: 0; }
    #weather-hud {
      position: fixed; left: 22px; bottom: 20px; z-index: 5;
      color: rgba(238, 249, 255, .86);
      font: 600 11px/1.6 Arial, sans-serif; letter-spacing: .16em;
      text-shadow: 0 1px 8px rgba(0, 25, 55, .7);
      pointer-events: none; user-select: none;
    }
    #weather-hud strong { display: block; font-size: 13px; letter-spacing: .2em; }
    #weather-hud span { opacity: .72; font-size: 9px; letter-spacing: .12em; }
    @media (prefers-reduced-motion: reduce) {
      .loading { transition: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="ocean" aria-label="Cinematic underwater-to-surface ocean scene"></canvas>
  <div id="underwater"></div>
  <div class="loading" id="loading">INITIALIZING OCEAN</div>
  <div id="weather-hud"><strong id="weather-name">CLEAR</strong><span>1 CLEAR · 2 DRIZZLE · 3 RAIN · 4 DOWNPOUR · 5 STORM · 6 CLOUDY · 7 TSUNAMI</span></div>

  <script type="module">
    import * as THREE from 'three';
    import { Water } from 'three/addons/objects/Water.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const canvas = document.getElementById('ocean');
    const loading = document.getElementById('loading');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 20000);
    // Begin below the surface, then rise through it into the open air.
    camera.position.set(0, -8, 82);
    camera.lookAt(0, 2, -100);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.82;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // Custom summer-sky shader: colors are authored directly, not inferred
    // from atmospheric scattering, so the blue stays saturated and predictable.
    const sun = new THREE.Vector3();
    sun.setFromSphericalCoords(
      1,
      THREE.MathUtils.degToRad(48),
      THREE.MathUtils.degToRad(205)
    );

    const skyGeometry = new THREE.SphereGeometry(10000, 48, 32);
    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      toneMapped: false,
      uniforms: {
        uSunDirection: { value: sun.clone().normalize() },
        uZenith: { value: new THREE.Color('#0759cf') },
        uUpper: { value: new THREE.Color('#087bea') },
        uHorizon: { value: new THREE.Color('#54c5f5') },
        uSunColor: { value: new THREE.Color('#fff2d2') },
        uLightning: { value: 0 },
        uOvercast: { value: 0 }
      },
      vertexShader: `
        varying vec3 vSkyDirection;
        void main() {
          vSkyDirection = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uSunDirection;
        uniform vec3 uZenith;
        uniform vec3 uUpper;
        uniform vec3 uHorizon;
        uniform vec3 uSunColor;
        uniform float uLightning;
        uniform float uOvercast;
        varying vec3 vSkyDirection;

        void main() {
          vec3 direction = normalize(vSkyDirection);
          float height = clamp(direction.y, 0.0, 1.0);
          vec3 skyColor = mix(uHorizon, uUpper, smoothstep(0.0, 0.52, height));
          skyColor = mix(skyColor, uZenith, smoothstep(0.52, 1.0, height));

          float sunDot = max(dot(direction, normalize(uSunDirection)), 0.0);
          float sunDisk = smoothstep(0.99935, 0.99982, sunDot);
          float sunHalo = pow(sunDot, 36.0) * 0.22;
          skyColor = mix(skyColor, uSunColor, clamp(sunDisk + sunHalo, 0.0, 1.0) * (1.0 - uOvercast * 0.92));
          vec3 overcastColor = vec3(0.39, 0.48, 0.56);
          skyColor = mix(skyColor, overcastColor, uOvercast * (0.28 + height * 0.42));
          skyColor += vec3(0.72, 0.82, 1.0) * uLightning;

          gl_FragColor = vec4(skyColor, 1.0);
          #include <colorspace_fragment>
        }
      `
    });
    const skyDome = new THREE.Mesh(skyGeometry, skyMaterial);
    skyDome.renderOrder = -1000;
    scene.add(skyDome);

    // Soft white summer cumulus clouds, kept near the horizon.
    const cloudCanvas = document.createElement('canvas');
    cloudCanvas.width = 512;
    cloudCanvas.height = 256;
    const cloudCtx = cloudCanvas.getContext('2d');
    cloudCtx.clearRect(0, 0, 512, 256);
    const cloudPuffs = [
      [90, 164, 90, 54], [158, 132, 92, 78], [236, 150, 108, 76],
      [320, 164, 92, 58], [395, 180, 70, 42], [190, 190, 170, 36]
    ];
    for (const [x, y, rx, ry] of cloudPuffs) {
      const puff = cloudCtx.createRadialGradient(x, y - ry * 0.12, 2, x, y, Math.max(rx, ry));
      puff.addColorStop(0, 'rgba(255,255,255,0.96)');
      puff.addColorStop(0.58, 'rgba(255,255,255,0.82)');
      puff.addColorStop(1, 'rgba(255,255,255,0)');
      cloudCtx.fillStyle = puff;
      cloudCtx.beginPath();
      cloudCtx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      cloudCtx.fill();
    }
    const cloudTexture = new THREE.CanvasTexture(cloudCanvas);
    cloudTexture.colorSpace = THREE.SRGBColorSpace;
    const cloudMaterial = new THREE.SpriteMaterial({
      map: cloudTexture,
      transparent: true,
      opacity: 0.88,
      depthWrite: false,
      fog: false
    });
    const cloudSpecs = [
      [-2500, 330, -3900, 1500, 750],
      [250, 250, -4600, 1750, 820],
      [2850, 430, -4100, 1450, 700],
      [-900, 620, -6200, 1100, 520]
    ];
    const cloudSprites = [];
    for (const [x, y, z, width, height] of cloudSpecs) {
      const cloud = new THREE.Sprite(cloudMaterial);
      cloud.position.set(x, y, z);
      cloud.scale.set(width, height, 1);
      scene.add(cloud);
      cloudSprites.push(cloud);
    }

    // A soft atmospheric halo reinforces the sun disk rendered by Sky.
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = glowCanvas.height = 256;
    const glowContext = glowCanvas.getContext('2d');
    const glowGradient = glowContext.createRadialGradient(128, 128, 5, 128, 128, 128);
    glowGradient.addColorStop(0, 'rgba(255, 248, 225, 0.9)');
    glowGradient.addColorStop(0.16, 'rgba(255, 232, 184, 0.34)');
    glowGradient.addColorStop(0.48, 'rgba(255, 220, 160, 0.09)');
    glowGradient.addColorStop(1, 'rgba(255, 220, 160, 0)');
    glowContext.fillStyle = glowGradient;
    glowContext.fillRect(0, 0, 256, 256);
    const sunGlowTexture = new THREE.CanvasTexture(glowCanvas);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: sunGlowTexture,
      color: 0xfff0d5,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false
    }));
    sunGlow.position.copy(sun).multiplyScalar(7800);
    sunGlow.scale.set(1250, 1250, 1);
    scene.add(sunGlow);


    const waterNormals = new THREE.TextureLoader().load(
      'https://threejs.org/examples/textures/waternormals.jpg',
      () => loading.classList.add('done'),
      undefined,
      () => loading.classList.add('done')
    );
    waterNormals.wrapS = THREE.RepeatWrapping;
    waterNormals.wrapT = THREE.RepeatWrapping;

    const water = new Water(new THREE.PlaneGeometry(12000, 12000), {
      textureWidth: 768,
      textureHeight: 768,
      waterNormals,
      sunDirection: sun.clone().normalize(),
      sunColor: 0xfff2d8,
      waterColor: 0x086782,
      distortionScale: 3.8,
      fog: false,
      alpha: 1
    });
    water.rotation.x = -Math.PI / 2;
    // Make the animated water visible from beneath the surface as the camera rises.
    water.material.side = THREE.DoubleSide;
    scene.add(water);

    // Distant CC0 Panamax container ship, loaded as a real external GLB asset.
    // Source: Innerscene, "Container ship loaded" (CC0).
    const shipGroup = new THREE.Group();
    shipGroup.position.set(-250, -2.5, -1120);
    scene.add(shipGroup);

    const shipLoader = new GLTFLoader();
    shipLoader.load(
      'https://vivaiathan.netlify.app/.netlify/functions/ship',
      (gltf) => {
        const shipModel = gltf.scene;
        // Slightly larger hero ship, while keeping surrounding ocean visible.
        shipModel.scale.setScalar(1.05);

        let bounds = new THREE.Box3().setFromObject(shipModel);
        let dimensions = bounds.getSize(new THREE.Vector3());

        // Some authoring pipelines export Z-up geometry. Convert it to Three.js Y-up.
        if (dimensions.z > dimensions.y) {
          shipModel.rotation.x = -Math.PI / 2;
          bounds = new THREE.Box3().setFromObject(shipModel);
        }

        const center = bounds.getCenter(new THREE.Vector3());
        const bottom = bounds.min.y;
        shipModel.position.set(-center.x, -bottom, -center.z);
        shipGroup.add(shipModel);
      },
      undefined,
      (error) => {
        console.warn('VIVAIATHAN: external container ship model could not be loaded.', error);
      }
    );


    // Procedural ship traffic remains available even if the optional GLB fails.
    const traffic=[];
    const mats={
      hull:new THREE.MeshStandardMaterial({color:0x203d4c,roughness:0.66,metalness:0.18}),
      white:new THREE.MeshStandardMaterial({color:0xdce6e6,roughness:0.72}),
      deck:new THREE.MeshStandardMaterial({color:0x899692,roughness:0.86}),
      glass:new THREE.MeshStandardMaterial({color:0x173e53,roughness:0.25}),
      red:new THREE.MeshStandardMaterial({color:0xa64b3d}),
      blue:new THREE.MeshStandardMaterial({color:0x315e78}),
      orange:new THREE.MeshStandardMaterial({color:0xc87535}),
      yellow:new THREE.MeshStandardMaterial({color:0xb4a04f})
    };
    const boxGeo=new THREE.BoxGeometry(1,1,1), cylGeo=new THREE.CylinderGeometry(1,1,1,16), coneGeo=new THREE.ConeGeometry(1,1,8);
    const wakeGeo=new THREE.PlaneGeometry(1,1);
    const wakeMat=new THREE.MeshBasicMaterial({color:0xa9d9e8,transparent:true,opacity:0.2,depthWrite:false,side:THREE.DoubleSide});
    function part(g,m,p,s,r){
      const o=new THREE.Mesh(g,m); o.position.set(...p); o.scale.set(...s); if(r)o.rotation.set(...r); return o;
    }
    function makeTrafficShip(a,i){
      const g=new THREE.Group(),L=a.L,W=a.W;
      g.add(part(boxGeo,a.hull,[0,1.1,0],[W,2.2,L*.78]));
      g.add(part(coneGeo,a.hull,[0,1.1,L*.34],[W*.51,L*.3,1],[Math.PI/2,0,0]));
      g.add(part(boxGeo,mats.deck,[0,2.2,-L*.08],[W*.82,.25,L*.56]));
      if(a.type==="cargo"){
        const cs=[mats.red,mats.blue,mats.white,mats.orange,mats.yellow],n=Math.max(2,Math.floor(L/34));
        for(let k=0;k<n;k++){const z=-L*.27+k*(L*.52/n);
          for(let side=-1;side<=1;side++)g.add(part(boxGeo,cs[(k+side+5)%cs.length],[side*W*.27,3.3,z],[W*.25,1.9,L*.52/n*.9]));
          if(k%2===0)g.add(part(boxGeo,cs[(k+2)%cs.length],[0,5.2,z],[W*.25,1.6,L*.52/n*.9]));
        }
        g.add(part(boxGeo,mats.white,[0,3.1,-L*.39],[W*.58,2,L*.13]));
      }else if(a.type==="tanker"){
        for(let k=0;k<4;k++){const z=-L*.24+k*L*.16;
          g.add(part(cylGeo,mats.white,[0,3,z],[W*.33,L*.12,W*.33],[Math.PI/2,0,0]));
          g.add(part(boxGeo,mats.deck,[0,2.4,z],[W*.72,.2,L*.025]));
        }
        g.add(part(boxGeo,mats.white,[0,3.15,-L*.39],[W*.62,2.4,L*.13]));
      }else if(a.type==="ferry"){
        g.add(part(boxGeo,mats.white,[0,3.4,-L*.12],[W*.78,2,L*.48]));
        g.add(part(boxGeo,mats.glass,[0,4.65,-L*.13],[W*.72,.6,L*.42]));
        for(let d=0;d<2;d++)g.add(part(boxGeo,mats.white,[0,4.9+d*.68,-L*.22],[W*(.68-d*.12),.5,L*.25]));
      }else{
        g.add(part(boxGeo,mats.white,[0,3.2,-L*.18],[W*.62,1.8,L*.3]));
        g.add(part(boxGeo,mats.glass,[0,4.25,-L*.18],[W*.58,.7,L*.2]));
        g.add(part(boxGeo,mats.orange,[0,4.9,-L*.2],[W*.12,.75,.8]));
      }
      g.add(part(cylGeo,mats.white,[0,5,-L*.34],[.2,2,.2]));
      const red=new THREE.Mesh(new THREE.SphereGeometry(.42,8,6),new THREE.MeshBasicMaterial({color:0xff5547}));
      red.position.set(-W*.51,2.5,L*.16);g.add(red);
      const green=new THREE.Mesh(new THREE.SphereGeometry(.42,8,6),new THREE.MeshBasicMaterial({color:0x42ff9b}));
      green.position.set(W*.51,2.5,L*.16);g.add(green);
      for(const side of [-1,1]){const wake=new THREE.Mesh(wakeGeo,wakeMat);wake.rotation.x=-Math.PI/2;
        wake.position.set(side*W*.22,.16,-L*.48);wake.scale.set(W*.28,L*.95,1);g.add(wake);}
      g.position.set(a.x,0,a.z);scene.add(g);
      traffic.push({root:g,L,W,radius:Math.max(L*.47,W*1.7),speed:a.speed,vel:new THREE.Vector3(0,0,a.speed),
        route:a.route.map(p=>new THREE.Vector3(p[0],0,p[1])),wp:1,heading:0,phase:i*1.7,bob:.35+i*.025});
    }
    [
      {type:"cargo",x:-520,z:-520,L:150,W:27,speed:13,hull:mats.hull,route:[[-520,-520],[480,-1050],[900,-1900],[-520,-520]]},
      {type:"tanker",x:360,z:-760,L:132,W:25,speed:10,hull:mats.hull,route:[[360,-760],[-720,-1250],[-1050,-2050],[360,-760]]},
      {type:"ferry",x:-80,z:-390,L:76,W:18,speed:16,hull:mats.blue,route:[[-80,-390],[620,-650],[900,-1150],[-80,-390]]},
      {type:"patrol",x:720,z:-420,L:48,W:12,speed:20,hull:mats.hull,route:[[720,-420],[250,-980],[-500,-1450],[720,-420]]},
      {type:"cargo",x:-980,z:-1180,L:118,W:22,speed:11,hull:mats.hull,route:[[-980,-1180],[-180,-1650],[520,-2200],[-980,-1180]]},
      {type:"tanker",x:1050,z:-1450,L:142,W:26,speed:9,hull:mats.hull,route:[[1050,-1450],[250,-1050],[-650,-700],[1050,-1450]]},
      {type:"ferry",x:1250,z:-650,L:68,W:17,speed:15,hull:mats.white,route:[[1250,-650],[600,-1200],[-250,-1750],[1250,-650]]}
    ].forEach(makeTrafficShip);

    // Predict closest point of approach and steer clear before vessels converge.
    function updateTraffic(delta,t,wind,sea){
      const desired=traffic.map((a,i)=>{
        if(a.route[a.wp].distanceTo(a.root.position)<95)a.wp=(a.wp+1)%a.route.length;
        const v=a.route[a.wp].clone().sub(a.root.position).normalize().multiplyScalar(a.speed),avoid=new THREE.Vector3();
        for(let j=0;j<traffic.length;j++){if(i===j)continue;const b=traffic[j];
          const rp=a.root.position.clone().sub(b.root.position),rv=a.vel.clone().sub(b.vel),vv=rv.lengthSq();
          const tc=vv>.01?THREE.MathUtils.clamp(-rp.dot(rv)/vv,0,15):0;
          const closest=rp.clone().addScaledVector(rv,tc),safe=a.radius+b.radius+95,d=closest.length();
          if(d<safe){const away=d>.01?closest.normalize():new THREE.Vector3(i%2?1:-1,0,0);avoid.addScaledVector(away,(1-d/safe)*(.8+tc/12));}
        }
        const p=a.root.position;if(p.x < -1750)avoid.x+=1.2;if(p.x>1750)avoid.x-=1.2;
        if(p.z < -2650)avoid.z+=1.2;if(p.z>-180)avoid.z-=1.2;
        v.addScaledVector(avoid,a.speed*1.35);return v.lengthSq()>.01?v.normalize().multiplyScalar(a.speed):a.vel.clone();
      });
      traffic.forEach((a,i)=>{
        a.vel.lerp(desired[i],Math.min(1,delta*.42));
        const heading=Math.atan2(a.vel.x,a.vel.z),diff=THREE.MathUtils.euclideanModulo(heading-a.heading+Math.PI,Math.PI*2)-Math.PI;
        a.heading+=diff*Math.min(1,delta*.72);a.root.rotation.y=a.heading;
        a.root.rotation.z=Math.sin(t*.7+a.phase)*.012*(.5+wind);
        a.root.rotation.x=Math.sin(t*.53+a.phase)*.009*(.45+sea*.22);
        a.root.position.addScaledVector(a.vel,delta);
        a.root.position.y=Math.sin(t*.8+a.phase)*a.bob*(.7+sea*.18);
      });
    }

    const hemisphere = new THREE.HemisphereLight(0xdff5ff, 0x24566a, 0.82);
    scene.add(hemisphere);

    const sunlight = new THREE.DirectionalLight(0xffedcf, 2.8);
    sunlight.position.copy(sun).multiplyScalar(500);
    scene.add(sunlight);

    const clock = new THREE.Clock();
    const underwaterOverlay = document.getElementById('underwater');

    // Weather presets are smoothly blended so the PV never hard-cuts.
    const weatherPresets = [
      { name: 'CLEAR', sky: ['#0759cf', '#087bea', '#54c5f5'], sun: '#fff2d2', water: 0x086782, distortion: 3.8, waveSpeed: 1.0, cloud: 0.88, overcast: 0.02, rain: 0, wind: 0, sea: 1, light: 1 },
      { name: 'DRIZZLE', sky: ['#315f9b', '#5d91b8', '#9ab8c5'], sun: '#d5dfdf', water: 0x315f78, distortion: 4.3, waveSpeed: 1.12, cloud: 0.78, overcast: 0.28, rain: 0.13, wind: 0.18, sea: 1.08, light: 0.78 },
      { name: 'RAIN', sky: ['#344b70', '#536e8c', '#8299a8'], sun: '#aebdca', water: 0x294e64, distortion: 5.0, waveSpeed: 1.3, cloud: 0.94, overcast: 0.52, rain: 0.38, wind: 0.38, sea: 1.22, light: 0.58 },
      { name: 'DOWNPOUR', sky: ['#202f49', '#394f68', '#637b8b'], sun: '#8498a9', water: 0x1d4058, distortion: 6.4, waveSpeed: 1.65, cloud: 1.0, overcast: 0.78, rain: 0.72, wind: 0.68, sea: 1.65, light: 0.38 },
      { name: 'STORM + LIGHTNING', sky: ['#101a2b', '#26364a', '#46596a'], sun: '#64778a', water: 0x142f43, distortion: 8.2, waveSpeed: 2.15, cloud: 1.0, overcast: 0.96, rain: 1, wind: 1, sea: 2.25, light: 0.24 },
      { name: 'CLOUDY', sky: ['#53677c', '#8194a3', '#b2c1c9'], sun: '#c7d0d4', water: 0x3b6677, distortion: 4.0, waveSpeed: 0.92, cloud: 1.0, overcast: 0.78, rain: 0, wind: 0.12, sea: 0.95, light: 0.68 }
    ];
    const weatherName = document.getElementById('weather-name');
    const rainGeometry = new THREE.BufferGeometry();
    const rainCount = 5200;
    const rainPositions = new Float32Array(rainCount * 3);
    const rainVelocities = new Float32Array(rainCount * 3);
    for (let i = 0; i < rainCount; i++) {
      rainPositions[i * 3] = (Math.random() - 0.5) * 260;
      rainPositions[i * 3 + 1] = Math.random() * 150;
      rainPositions[i * 3 + 2] = (Math.random() - 0.5) * 260;
      rainVelocities[i * 3] = Math.random() - 0.5;
      rainVelocities[i * 3 + 1] = 0.7 + Math.random() * 0.8;
      rainVelocities[i * 3 + 2] = Math.random() - 0.5;
    }
    rainGeometry.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
    const rainMaterial = new THREE.PointsMaterial({
      color: 0xd9efff, size: 1.35, transparent: true, opacity: 0,
      depthWrite: false, sizeAttenuation: true
    });
    const rainField = new THREE.Points(rainGeometry, rainMaterial);
    rainField.frustumCulled = false;
    scene.add(rainField);
    const lightning = new THREE.PointLight(0xd9eaff, 0, 0, 2);
    lightning.position.set(0, 120, -180);
    scene.add(lightning);

    // A cinematic, non-interactive tsunami wall for the PV. It travels in
    // from the distant horizon and passes the ship/camera without changing
    // the normal ocean controls or weather presets.
    const tsunamiGeometry = new THREE.PlaneGeometry(3400, 900, 120, 36);
    const tsunamiMaterial = new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying float vHeight;
        varying float vFoam;
        void main() {
          vUv = uv;
          vec3 p = position;
          float crest = sin(p.x * 0.0028 + uTime * 0.72);
          float secondary = sin(p.x * 0.006 + uTime * 1.1);
          float envelope = smoothstep(0.0, 0.18, uv.y) * (0.45 + 0.55 * uv.y);
          p.z += (crest * 105.0 + secondary * 28.0) * envelope;
          p.z += sin(uv.y * 8.0 + uTime * 1.7 + p.x * 0.001) * 15.0;
          vHeight = uv.y;
          vFoam = crest * 0.5 + secondary * 0.22;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying float vHeight;
        varying float vFoam;
        void main() {
          vec3 deep = vec3(0.012, 0.16, 0.27);
          vec3 middle = vec3(0.025, 0.39, 0.53);
          vec3 crest = vec3(0.34, 0.76, 0.82);
          vec3 color = mix(deep, middle, smoothstep(0.02, 0.78, vHeight));
          color = mix(color, crest, smoothstep(0.78, 0.98, vHeight) * 0.72);
          float foamLine = smoothstep(0.84, 0.93, vHeight + vFoam * 0.045);
          float foamNoise = sin(vUv.x * 145.0 + uTime * 2.2) * sin(vUv.x * 63.0 - uTime);
          float foam = foamLine * smoothstep(-0.15, 0.55, foamNoise);
          color = mix(color, vec3(0.83, 0.95, 0.96), foam * 0.92);
          float edgeFade = smoothstep(0.0, 0.045, vUv.x) * (1.0 - smoothstep(0.955, 1.0, vUv.x));
          float alpha = edgeFade * smoothstep(0.0, 0.06, vHeight) * 0.97;
          gl_FragColor = vec4(color, alpha);
        }
      `,
      transparent: true,
      depthWrite: false
    });
    const tsunamiWave = new THREE.Mesh(tsunamiGeometry, tsunamiMaterial);
    tsunamiWave.position.set(0, 445, -3600);
    tsunamiWave.visible = false;
    tsunamiWave.frustumCulled = false;
    scene.add(tsunamiWave);
    const tsunamiState = { active: false, elapsed: 0, passed: false };
    function activateTsunami() {
      tsunamiState.active = !tsunamiState.active;
      tsunamiState.elapsed = 0;
      tsunamiState.passed = false;
      tsunamiWave.position.z = -3600;
      tsunamiWave.visible = tsunamiState.active;
      weatherName.textContent = tsunamiState.active ? 'TSUNAMI APPROACHING' : weatherPresets[weatherIndex].name;
    }

    let weatherIndex = 0;
    let weatherBlend = { ...weatherPresets[0] };
    let weatherFrom = { ...weatherBlend };
    let weatherTo = { ...weatherBlend };
    let weatherTransitionStart = 0;
    let lightningTimer = 4 + Math.random() * 7;
    let lightningFlash = 0;
    let lightningPulse = 0;
    const weatherKeys = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6'];
    function selectWeather(index) {
      if (index === weatherIndex) return;
      weatherIndex = index;
      weatherFrom = { ...weatherBlend };
      weatherTo = { ...weatherPresets[index] };
      weatherTransitionStart = clock.elapsedTime;
      weatherName.textContent = weatherTo.name;
    }
    function blendWeather(a, b, amount) {
      const mix = (x, y) => x + (y - x) * amount;
      const colorMix = (x, y) => new THREE.Color(x).lerp(new THREE.Color(y), amount);
      return {
        ...b,
        skyColors: a.sky.map((color, i) => colorMix(color, b.sky[i])),
        sunColor: colorMix(a.sun, b.sun),
        waterColor: colorMix(new THREE.Color(a.water), new THREE.Color(b.water)),
        distortion: mix(a.distortion, b.distortion),
        waveSpeed: mix(a.waveSpeed, b.waveSpeed),
        cloud: mix(a.cloud, b.cloud),
        overcast: mix(a.overcast, b.overcast),
        rain: mix(a.rain, b.rain),
        wind: mix(a.wind, b.wind),
        sea: mix(a.sea, b.sea),
        light: mix(a.light, b.light)
      };
    }
    addEventListener('keydown', (event) => {
      if (event.code === 'Digit7' && !event.repeat) {
        event.preventDefault();
        activateTsunami();
        return;
      }
      const weatherKeyIndex = weatherKeys.indexOf(event.code);
      if (weatherKeyIndex !== -1) {
        event.preventDefault();
        selectWeather(weatherKeyIndex);
      }
    });
    const ascentDuration = 9.5;
    const startZ = 82;
    const endZ = 30;

    // Manual camera controls unlock after the cinematic ascent.
    const pressedKeys = new Set();
    let cameraYaw = 0;
    let cameraPitch = 0;
    const moveSpeed = 48;
    const turnSpeed = 1.35;
    const controlKeys = new Set([
      'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyZ', 'KeyX',
      'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'
    ]);

    addEventListener('keydown', (event) => {
      if (!controlKeys.has(event.code)) return;
      event.preventDefault();
      if (ascentComplete()) pressedKeys.add(event.code);
    });

    addEventListener('keyup', (event) => {
      pressedKeys.delete(event.code);
    });

    addEventListener('blur', () => pressedKeys.clear());

    function ascentComplete() {
      return clock.elapsedTime >= ascentDuration;
    }

    function smoothstep01(value) {
      const x = THREE.MathUtils.clamp(value, 0, 1);
      return x * x * (3 - 2 * x);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.04);
      const t = clock.elapsedTime;
      const ascent = smoothstep01(t / ascentDuration);

      const weatherProgress = smoothstep01((t - weatherTransitionStart) / 3.2);
      weatherBlend = blendWeather(weatherFrom, weatherTo, weatherProgress);
      const skyUniforms = skyMaterial.uniforms;
      skyUniforms.uZenith.value.copy(weatherBlend.skyColors[0]);
      skyUniforms.uUpper.value.copy(weatherBlend.skyColors[1]);
      skyUniforms.uHorizon.value.copy(weatherBlend.skyColors[2]);
      skyUniforms.uSunColor.value.copy(weatherBlend.sunColor);
      skyUniforms.uOvercast.value = weatherBlend.overcast;
      hemisphere.intensity = 0.82 * weatherBlend.light;
      sunlight.intensity = 2.8 * weatherBlend.light;
      water.material.uniforms.time.value += delta * weatherBlend.waveSpeed;
      water.material.uniforms.distortionScale.value = weatherBlend.distortion + (tsunamiState.active ? 1.8 : 0);
      tsunamiMaterial.uniforms.uTime.value = t;
      if (tsunamiState.active) {
        tsunamiState.elapsed += delta;
        tsunamiWave.position.z += delta * 88;
        if (tsunamiWave.position.z > camera.position.z + 90) {
          tsunamiState.passed = true;
          tsunamiWave.visible = false;
          tsunamiState.active = false;
          weatherName.textContent = weatherPresets[weatherIndex].name;
        }
      }
      water.material.uniforms.waterColor.value.copy(weatherBlend.waterColor);
      water.material.uniforms.sunColor.value.copy(weatherBlend.sunColor);
      cloudMaterial.opacity = weatherBlend.cloud;
      cloudSprites.forEach((cloud, index) => {
        cloud.position.x += delta * (3 + weatherBlend.wind * 18) * (index % 2 ? -1 : 1);
      });
      rainMaterial.opacity = weatherBlend.rain > 0.02 ? 0.78 : 0;
      rainMaterial.size = 1.15 + weatherBlend.rain * 1.25;
      rainGeometry.setDrawRange(0, Math.floor(rainCount * weatherBlend.rain));
      rainField.visible = weatherBlend.rain > 0.015;
      rainField.position.set(camera.position.x, 0, camera.position.z);
      for (let i = 0; i < rainCount; i++) {
        const p = i * 3;
        rainPositions[p] += (rainVelocities[p] + weatherBlend.wind * 3.8) * delta * 24;
        rainPositions[p + 1] -= rainVelocities[p + 1] * delta * (65 + weatherBlend.rain * 100);
        rainPositions[p + 2] += (rainVelocities[p + 2] + weatherBlend.wind * 1.8) * delta * 24;
        if (rainPositions[p + 1] < -2) {
          rainPositions[p] = (Math.random() - 0.5) * 260;
          rainPositions[p + 1] = 90 + Math.random() * 65;
          rainPositions[p + 2] = (Math.random() - 0.5) * 260;
        }
      }
      rainGeometry.attributes.position.needsUpdate = true;

      if (weatherIndex === 4) {
        lightningTimer -= delta;
        if (lightningTimer <= 0 && lightningFlash <= 0) {
          lightningFlash = 0.12 + Math.random() * 0.12;
          lightningPulse = 0.8 + Math.random() * 1.8;
          lightningTimer = 3.5 + Math.random() * 8;
        }
      } else {
        lightningFlash = Math.max(0, lightningFlash - delta * 5);
      }
      if (lightningFlash > 0) {
        lightningFlash = Math.max(0, lightningFlash - delta * 5.5);
        const flashPower = lightningFlash * lightningPulse;
        skyUniforms.uLightning.value = flashPower * 0.75;
        lightning.intensity = flashPower * 85;
        lightning.position.set(camera.position.x + 35, 100, camera.position.z - 120);
      } else {
        skyUniforms.uLightning.value = 0;
        lightning.intensity = 0;
      }

      const tsunamiDistance = tsunamiState.active ? Math.abs(tsunamiWave.position.z - shipGroup.position.z) : 99999;
      const tsunamiImpact = tsunamiState.active ? 1 - THREE.MathUtils.smoothstep(tsunamiDistance, 180, 1450) : 0;
      const seaMotion = weatherBlend.sea * (1 + tsunamiImpact * 1.65);
      shipGroup.position.y = -2.5 + Math.sin(t * (0.62 + weatherBlend.wind * 0.24 + tsunamiImpact * 0.55)) * (0.8 * seaMotion);
      shipGroup.rotation.z = Math.sin(t * 0.28) * 0.0025 * seaMotion;
      shipGroup.rotation.x = Math.sin(t * 0.43) * 0.0015 * (weatherBlend.wind + tsunamiImpact * 0.8);
      shipGroup.position.x = -250 + Math.sin(t * 0.035) * (8 + weatherBlend.wind * 5);
      updateTraffic(delta, t, weatherBlend.wind, weatherBlend.sea);

      // A slow cinematic ascent: submerged blue, a brief surface crossing,
      // then a calm reveal of the bright horizon.
      if (t < ascentDuration) {
        camera.position.x = Math.sin(t * 0.11) * 0.65;
        camera.position.z = THREE.MathUtils.lerp(startZ, endZ, ascent);
        camera.position.y = THREE.MathUtils.lerp(-8, 7.5, ascent)
          + (ascent > 0.98 ? Math.sin(t * 0.7) * 0.18 : 0);
        camera.lookAt(camera.position.x * 0.12, 2.5, -100);
      } else {
        const turnAmount = turnSpeed * delta;
        if (pressedKeys.has('ArrowLeft')) cameraYaw -= turnAmount;
        if (pressedKeys.has('ArrowRight')) cameraYaw += turnAmount;
        if (pressedKeys.has('ArrowUp')) cameraPitch = Math.min(1.2, cameraPitch + turnAmount);
        if (pressedKeys.has('ArrowDown')) cameraPitch = Math.max(-1.2, cameraPitch - turnAmount);

        const forward = new THREE.Vector3(Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
        const right = new THREE.Vector3(Math.cos(cameraYaw), 0, Math.sin(cameraYaw));
        const movement = new THREE.Vector3();

        if (pressedKeys.has('KeyW')) movement.add(forward);
        if (pressedKeys.has('KeyS')) movement.sub(forward);
        if (pressedKeys.has('KeyD')) movement.add(right);
        if (pressedKeys.has('KeyA')) movement.sub(right);
        if (pressedKeys.has('KeyZ')) movement.y += 1;
        if (pressedKeys.has('KeyX')) movement.y -= 1;

        if (movement.lengthSq() > 0) {
          movement.normalize().multiplyScalar(moveSpeed * delta);
          camera.position.add(movement);
        }

        const lookDirection = new THREE.Vector3(
          Math.sin(cameraYaw) * Math.cos(cameraPitch),
          Math.sin(cameraPitch),
          -Math.cos(cameraYaw) * Math.cos(cameraPitch)
        );
        camera.lookAt(camera.position.clone().add(lookDirection));
      }

      if (tsunamiState.active && ascentComplete()) {
        const cameraDistance = Math.abs(tsunamiWave.position.z - camera.position.z);
        const shake = (1 - THREE.MathUtils.smoothstep(cameraDistance, 120, 1600)) * 0.16;
        camera.position.x += Math.sin(t * 31) * shake;
        camera.position.y += Math.cos(t * 27) * shake * 0.55;
      }

      underwaterOverlay.style.opacity = String(1 - smoothstep01((camera.position.y + 5.5) / 8.5));

      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
      renderer.setSize(innerWidth, innerHeight);
    });

    setTimeout(() => loading.classList.add('done'), 5000);
  </script>
</body>
</html>
