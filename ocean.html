<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#58b8ef">
  <title>VIVAIATHAN // Ocean</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #58b8ef; }
    body { position: relative; }
    #ocean { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #underwater {
      position: fixed; inset: 0; pointer-events: none; opacity: .96;
      background:
        radial-gradient(ellipse at 50% 4%, rgba(111, 220, 255, .42), transparent 54%),
        linear-gradient(180deg, rgba(0, 112, 196, .66), rgba(0, 42, 126, .82));
      mix-blend-mode: normal; transition: opacity .15s linear;
    }
    .loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: rgba(12, 48, 65, .72); font: 600 10px Arial, sans-serif;
      letter-spacing: .24em; pointer-events: none; transition: opacity .7s ease;
    }
    .loading.done { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      .loading { transition: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="ocean" aria-label="Cinematic underwater-to-surface ocean scene"></canvas>
  <div id="underwater"></div>
  <div class="loading" id="loading">INITIALIZING OCEAN</div>

  <script type="module">
    import * as THREE from 'three';
    import { Water } from 'three/addons/objects/Water.js';
    import { Sky } from 'three/addons/objects/Sky.js';

    const canvas = document.getElementById('ocean');
    const loading = document.getElementById('loading');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 20000);
    // Begin below the surface, then rise through it into the open air.
    camera.position.set(0, -8, 82);
    camera.lookAt(0, 2, -100);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.98;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const sky = new Sky();
    sky.scale.setScalar(10000);
    scene.add(sky);

    const skyUniforms = sky.material.uniforms;
    skyUniforms.turbidity.value = 2.1;
    skyUniforms.rayleigh.value = 2.8;
    skyUniforms.mieCoefficient.value = 0.0035;
    skyUniforms.mieDirectionalG.value = 0.78;

    const sun = new THREE.Vector3();
    sun.setFromSphericalCoords(
      1,
      THREE.MathUtils.degToRad(48),
      THREE.MathUtils.degToRad(205)
    );
    skyUniforms.sunPosition.value.copy(sun);

    // A soft atmospheric halo reinforces the sun disk rendered by Sky.
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = glowCanvas.height = 256;
    const glowContext = glowCanvas.getContext('2d');
    const glowGradient = glowContext.createRadialGradient(128, 128, 5, 128, 128, 128);
    glowGradient.addColorStop(0, 'rgba(255, 248, 225, 0.9)');
    glowGradient.addColorStop(0.16, 'rgba(255, 232, 184, 0.34)');
    glowGradient.addColorStop(0.48, 'rgba(255, 220, 160, 0.09)');
    glowGradient.addColorStop(1, 'rgba(255, 220, 160, 0)');
    glowContext.fillStyle = glowGradient;
    glowContext.fillRect(0, 0, 256, 256);
    const sunGlowTexture = new THREE.CanvasTexture(glowCanvas);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: sunGlowTexture,
      color: 0xfff0d5,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false
    }));
    sunGlow.position.copy(sun).multiplyScalar(7800);
    sunGlow.scale.set(1250, 1250, 1);
    scene.add(sunGlow);


    const waterNormals = new THREE.TextureLoader().load(
      'https://threejs.org/examples/textures/waternormals.jpg',
      () => loading.classList.add('done'),
      undefined,
      () => loading.classList.add('done')
    );
    waterNormals.wrapS = THREE.RepeatWrapping;
    waterNormals.wrapT = THREE.RepeatWrapping;

    const water = new Water(new THREE.PlaneGeometry(12000, 12000), {
      textureWidth: 768,
      textureHeight: 768,
      waterNormals,
      sunDirection: sun.clone().normalize(),
      sunColor: 0xfff2d8,
      waterColor: 0x086782,
      distortionScale: 3.8,
      fog: false,
      alpha: 1
    });
    water.rotation.x = -Math.PI / 2;
    // Make the animated water visible from beneath the surface as the camera rises.
    water.material.side = THREE.DoubleSide;
    scene.add(water);

    scene.add(new THREE.HemisphereLight(0xdff5ff, 0x24566a, 0.82));

    const sunlight = new THREE.DirectionalLight(0xffedcf, 2.8);
    sunlight.position.copy(sun).multiplyScalar(500);
    scene.add(sunlight);

    const clock = new THREE.Clock();
    const underwaterOverlay = document.getElementById('underwater');
    const ascentDuration = 9.5;
    const startZ = 82;
    const endZ = 30;

    function smoothstep01(value) {
      const x = THREE.MathUtils.clamp(value, 0, 1);
      return x * x * (3 - 2 * x);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.04);
      const t = clock.elapsedTime;
      const ascent = smoothstep01(t / ascentDuration);

      water.material.uniforms.time.value += delta;

      // A slow cinematic ascent: submerged blue, a brief surface crossing,
      // then a calm reveal of the bright horizon.
      camera.position.x = Math.sin(t * 0.11) * 0.65;
      camera.position.z = THREE.MathUtils.lerp(startZ, endZ, ascent);
      camera.position.y = THREE.MathUtils.lerp(-8, 7.5, ascent)
        + (ascent > 0.98 ? Math.sin(t * 0.7) * 0.18 : 0);

      camera.lookAt(camera.position.x * 0.12, 2.5, -100);
      underwaterOverlay.style.opacity = String(0.96 * (1 - smoothstep01((camera.position.y + 5) / 8)));

      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
      renderer.setSize(innerWidth, innerHeight);
    });

    setTimeout(() => loading.classList.add('done'), 5000);
  </script>
</body>
</html>
