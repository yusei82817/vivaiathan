<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIVAIATHAN // Field HUD</title><link rel="stylesheet" href="ui.css">
<style>
.field{height:100vh;min-height:480px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,rgba(52,83,83,.18),transparent 48%),linear-gradient(180deg,#101a20,#080d12)}
.field:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,9,12,.7),transparent 24%,transparent 76%,rgba(4,9,12,.7)),linear-gradient(0deg,rgba(4,9,12,.8),transparent 30%,transparent 70%,rgba(4,9,12,.6))}
.hud-top{position:absolute;top:22px;left:26px;right:26px;display:flex;justify-content:space-between;gap:16px}.hud-block,.vital,.weapon{padding:12px 15px;background:rgba(8,14,18,.82);border:1px solid var(--line)}
.hud-label{font-size:9px;color:var(--muted);letter-spacing:.18em}.hud-value{font:600 22px var(--display);margin-top:4px}
.objective{position:absolute;top:105px;left:26px;max-width:280px;padding:14px 17px;border-left:2px solid var(--cyan);background:linear-gradient(90deg,rgba(8,14,18,.78),transparent)}.objective strong{display:block;font:600 22px var(--display);margin:5px 0}.objective p{font-size:10px;line-height:1.6;color:#9aabb0;margin:0}
.crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.75}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#d5e5e4}.crosshair:before{width:1px;height:22px;left:10px}.crosshair:after{height:1px;width:22px;top:10px}
.hud-bottom{position:absolute;bottom:22px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:end;gap:18px}.vitals{display:flex;gap:8px}.vital{min-width:112px}.vital strong,.weapon strong{display:block;font:600 25px var(--display);margin-top:4px}.bar{height:3px;background:#26373c;margin-top:9px}.bar i{display:block;height:100%;width:100%;background:var(--cyan)}.weapon{text-align:right}.weapon small{color:var(--muted);font-size:9px;letter-spacing:.15em}
.exit{position:absolute;right:26px;top:105px}.notice{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);text-align:center;color:#81949a;font-size:10px;letter-spacing:.12em;white-space:nowrap}
@media(max-width:620px){.hud-top{left:12px;right:12px;top:12px}.objective{left:12px;top:90px}.exit{right:12px;top:200px}.hud-bottom{left:12px;right:12px;bottom:12px;align-items:stretch;flex-direction:column}.vitals{gap:5px}.vital{flex:1;min-width:0;padding:9px}.weapon{text-align:left}.notice{bottom:115px;font-size:8px}}
</style></head>
<body><main class="field">
<div class="hud-top">
<div class="hud-block"><div class="hud-label">OPERATION</div><div class="hud-value">SECTOR 07</div></div>
<div class="hud-block"><div class="hud-label">ELAPSED TIME</div><div class="hud-value" id="clock">00:00</div></div>
<div class="hud-block"><div class="hud-label">NETWORK</div><div class="hud-value" style="color:var(--amber);font-size:16px">OFFLINE</div></div>
</div>
<div class="objective"><div class="eyebrow">Primary objective</div><strong>SECURE THE AREA</strong><p>Move through the sector and locate a safe route. Field simulation is not active in this build.</p></div>
<button class="btn ghost exit" onclick="go('lobby.html')">Abort Operation</button>
<div class="crosshair"></div><div class="notice">FIELD SIMULATION // WAITING FOR GAMEPLAY SYSTEMS</div>
<div class="hud-bottom"><div class="vitals">
<div class="vital"><span class="hud-label">HEALTH</span><strong>100</strong><div class="bar"><i></i></div></div>
<div class="vital"><span class="hud-label">STAMINA</span><strong>100</strong><div class="bar"><i style="background:#d9a65b"></i></div></div>
</div><div class="weapon"><small>PRIMARY WEAPON</small><strong>UNARMED</strong><small>AMMO -- / --</small></div></div>
</main>
<script>
function go(screen){
  const allowedScreens = ['title.html','lobby.html','game.html','requisition.html'];
  if (!allowedScreens.includes(screen)) return;
  if (window.parent !== window) {
    if (typeof window.parent.setScreen === 'function') window.parent.setScreen(screen);
    else window.parent.postMessage({ screen }, window.location.origin);
  } else {
    window.location.assign(screen);
  }
}
let seconds=0;setInterval(()=>{seconds++;document.getElementById('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');},1000);
</script></body></html>
